
name: Multi Model Connection Test

on:
  workflow_dispatch:

jobs:
  test-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Gemini and OpenRouter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          def post_json(url, headers, payload, timeout=120, retries=3):
              for attempt in range(1, retries + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          data=json.dumps(payload).encode("utf-8"),
                          headers=headers,
                          method="POST"
                      )

                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return json.loads(response.read().decode("utf-8"))

                  except Exception as error:
                      print(f"Attempt {attempt}/{retries} failed: {type(error).__name__}: {error}")

                      if attempt == retries:
                          raise

                      time.sleep(attempt * 10)

          results = {}

          print("TESTING GEMINI")

          try:
              gemini_key = os.environ["GEMINI_API_KEY"]

              data = post_json(
                  "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + gemini_key,
                  {"Content-Type": "application/json"},
                  {
                      "contents": [{
                          "parts": [{
                              "text": "Reply with exactly GEMINI_SUCCESS"
                          }]
                      }]
                  }
              )

              text = " ".join(
                  part.get("text", "")
                  for candidate in data.get("candidates", [])
                  for part in candidate.get("content", {}).get("parts", [])
              ).strip()

              if not text:
                  raise ValueError("Gemini returned no text")

              print("Gemini response:", text)
              results["Gemini"] = True

          except Exception as error:
              print("GEMINI_FAILED:", type(error).__name__, str(error))
              results["Gemini"] = False

          print("\nTESTING OPENROUTER")

          try:
              openrouter_key = os.environ["OPENROUTER_API_KEY"]

              data = post_json(
                  "https://openrouter.ai/api/v1/chat/completions",
                  {
                      "Authorization": "Bearer " + openrouter_key,
                      "Content-Type": "application/json"
                  },
                  {
                      "model": "openrouter/free",
                      "messages": [{
                          "role": "user",
                          "content": "Reply with exactly OPENROUTER_SUCCESS"
                      }],
                      "max_tokens": 80
                  }
              )

              print("Selected model:", data.get("model", "Unknown"))

              choices = data.get("choices", [])
              if not choices:
                  raise ValueError("OpenRouter returned no choices")

              message = choices[0].get("message", {})
              content = message.get("content")

              if isinstance(content, str):
                  text = content.strip()
              elif isinstance(content, list):
                  text = " ".join(
                      item.get("text", "")
                      for item in content
                      if isinstance(item, dict)
                  ).strip()
              else:
                  text = ""

              if not text:
                  raise ValueError(
                      "No text content. Response structure: " +
                      json.dumps(data)[:2000]
                  )

              print("OpenRouter response:", text)
              results["OpenRouter"] = True

          except Exception as error:
              print("OPENROUTER_FAILED:", type(error).__name__, str(error))
              results["OpenRouter"] = False

          print("\nFINAL RESULTS")
          for provider, status in results.items():
              print(provider, "SUCCESS" if status else "FAILED")

          if not any(results.values()):
              raise SystemExit("All AI providers failed")

          print("\nAT LEAST ONE AI PROVIDER VERIFIED")
          PY

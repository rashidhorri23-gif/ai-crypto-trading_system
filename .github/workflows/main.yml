
name: Manual Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python application
        run: python Src/Main.py

      - name: Run historical recovery test
        run: python Src/Data/recovery_test.py

      - name: Run data quality validation
        run: python Src/Data/data_quality_validation.py

      - name: Run technical indicators test
       run: python Src/Analysis/indicator_test.py
       
      - name: Run independent indicator unit test
        run: python Src/Analysis/indicator_unit_test.py

      - name: Save historical archive to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/Archive/

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Update BTC historical archive"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi


name: Autonomous AI Provider Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ai-providers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Gemini and OpenRouter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.test_ai_providers

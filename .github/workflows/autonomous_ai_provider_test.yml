
name: Autonomous OpenRouter Engine Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-openrouter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test OpenRouter connection
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.test_ai_providers

      - name: Test free model discovery
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.test_model_manager

      - name: Test model comparison
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.test_model_comparison

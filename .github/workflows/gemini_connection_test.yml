
name: Gemini Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-genai

      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              print("ERROR: GEMINI_API_KEY is missing.")
              sys.exit(1)

          try:
              client = genai.Client(
                  api_key=api_key,
                  http_options=types.HttpOptions(
                      api_version="v1beta"
                  )
              )

              print("Connecting to Gemini API...")

              response = client.models.generate_content(
                  model="gemini-3.8-flash",
                  contents="Reply only with: GEMINI_CONNECTION_SUCCESSFUL"
              )

              print("Gemini response:")
              print(response.text)

              if response.text and "GEMINI_CONNECTION_SUCCESSFUL" in response.text:
                  print("SUCCESS: Gemini API connection verified.")
              else:
                  print("WARNING: API responded, but the expected text was not returned.")
                  sys.exit(1)

          except Exception as error:
              print("ERROR: Gemini API request failed.")
              print("Error type:", type(error).__name__)
              print("Error details:", str(error))

              sys.exit(1)
          PY


name: Gemini Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-genai

      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              print("ERROR: GEMINI_API_KEY is missing.")
              sys.exit(1)

          client = genai.Client(
              api_key=api_key,
              http_options=types.HttpOptions(
                  api_version="v1beta"
              )
          )

          models = [
              "gemini-3.8-flash",
              "gemini-3.7-flash"
          ]

          prompt = "Reply only with: GEMINI_CONNECTION_SUCCESSFUL"

          for model in models:
              print(f"Testing model: {model}")

              for attempt in range(1, 4):
                  try:
                      response = client.models.generate_content(
                          model=model,
                          contents=prompt
                      )

                      result = response.text or ""

                      print("Gemini response:", result)

                      if "GEMINI_CONNECTION_SUCCESSFUL" in result:
                          print("SUCCESS: Gemini API connection verified.")
                          print("Working model:", model)
                          sys.exit(0)

                      print("ERROR: Unexpected response.")
                      sys.exit(1)

                  except Exception as error:
                      error_message = str(error)

                      if "503" in error_message or "UNAVAILABLE" in error_message:
                          if attempt < 3:
                              wait_time = 5 * (2 ** (attempt - 1))
                              print(
                                  f"Model busy. Retry {attempt}/3 "
                                  f"after {wait_time} seconds."
                              )
                              time.sleep(wait_time)
                              continue

                          print(f"Model unavailable: {model}")
                          break

                      print("API request failed.")
                      print("Error type:", type(error).__name__)
                      print("Error details:", error_message)
                      sys.exit(1)

          print("ERROR: All available models failed.")
          sys.exit(1)
          PY

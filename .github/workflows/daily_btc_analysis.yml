
name: Daily BTC 4H Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update BTC 4H Data From OKX
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.update_btc_4h_data

      - name: Run BTC 4H Analysis Preparation
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.daily_btc_analysis

      - name: Upload BTC Analysis Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-4H-Analysis
          path: |
            Reports/BTC_4H_Vision_Chart.png
            Reports/BTC_4H_Market_Context.txt
          if-no-files-found: warn
          retention-days: 7

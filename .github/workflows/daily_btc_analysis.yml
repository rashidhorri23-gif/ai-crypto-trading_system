name: Daily BTC 15M AI Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: write

concurrency:
  group: daily-btc-analysis
  cancel-in-progress: false

jobs:
  btc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update BTC 4H Data From OKX
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.update_btc_4h_data

      - name: Save Updated BTC Archive
        run: |
          git add Data/Archive/BTC_USDT_SPOT_4H.csv

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update BTC 4H market data"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed. Manual review is required."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "BTC archive update pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed."
            sleep 3
          done

          echo "Unable to push BTC archive after 5 attempts."
          exit 1

      - name: Run BTC 4H Vision Analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.daily_btc_analysis

      - name: Publish Current BTC Signal
        run: |
          if [ ! -f Reports/BTC_4H_Vision_Report.json ]; then
            echo "BTC vision report was not generated."
            exit 1
          fi

          mkdir -p Data/Signals
          cp Reports/BTC_4H_Vision_Report.json Data/Signals/current_btc_signal.json

          git add Data/Signals/current_btc_signal.json

          if git diff --cached --quiet; then
            echo "No signal report changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish latest BTC AI analysis"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed. Manual review is required."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "BTC signal published successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed."
            sleep 3
          done

          echo "Unable to publish BTC signal after 5 attempts."
          exit 1

      - name: Upload BTC Analysis Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-4H-Analysis
          path: |
            Reports/BTC_4H_Vision_Chart.png
            Reports/BTC_4H_Market_Context.txt
            Reports/BTC_4H_Vision_Report.json
            Reports/BTC_4H_Vision_Raw.txt
          if-no-files-found: warn
          retention-days: 7

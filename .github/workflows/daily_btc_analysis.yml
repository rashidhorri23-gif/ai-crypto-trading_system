name: Daily BTC 15M AI Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-market-pipeline
  cancel-in-progress: false

jobs:
  btc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for TradingView Charts
        run: |
          python -m playwright install --with-deps chromium

      - name: Update BTC 5M, 15M and 4H Data
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.update_btc_4h_data

      - name: Save Updated BTC Archives
        run: |
          git add \
            Data/Archive/BTC_USDT_SPOT_5m.csv \
            Data/Archive/BTC_USDT_SPOT_15m.csv \
            Data/Archive/BTC_USDT_SPOT_4H.csv

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update BTC multi-timeframe market data"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "BTC archives pushed successfully."
              exit 0
            fi

            sleep 3
          done

          echo "Unable to push BTC archives."
          exit 1

      - name: Run BTC AI Analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.daily_btc_analysis

      - name: Validate and Publish BTC AI Report
        run: |
          test -s Reports/BTC_4H_Vision_Report.json

          python -c "import json; json.load(open('Reports/BTC_4H_Vision_Report.json', encoding='utf-8'))"

          mkdir -p Data/Signals
          cp Reports/BTC_4H_Vision_Report.json Data/Signals/current_btc_signal.json

          git add \
            Reports/BTC_4H_Vision_Report.json \
            Data/Signals/current_btc_signal.json

          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish latest BTC AI analysis"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "BTC AI report published successfully."
              exit 0
            fi

            sleep 3
          done

          echo "Unable to publish BTC AI report."
          exit 1

      - name: Upload BTC Analysis Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Analysis
          path: |
            Reports/BTC_4H_Vision_Chart.png
            Reports/BTC_4H_Market_Context.txt
            Reports/BTC_4H_Vision_Report.json
            Reports/BTC_4H_Vision_Raw.txt
          if-no-files-found: warn
          retention-days: 7

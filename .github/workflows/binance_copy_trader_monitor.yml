name: Binance Futures Top 10 Trader Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-copy-trader-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: feature/binance-top10-monitor
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Monitor Tests
        run: |
          python -m unittest Src.Engines.AutonomousTechnicalAnalyst.test_binance_copy_trader_monitor -v

      - name: Run Binance Copy Trader Monitor
        env:
          KOPYON_API_KEY: ${{ secrets.KOPYON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.binance_copy_trader_monitor

      - name: Save Monitor State
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Signals/binance_copy_trader_state.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Update Binance copy trader monitoring state"
          git push origin HEAD:feature/binance-top10-monitor

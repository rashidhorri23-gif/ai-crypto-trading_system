name: BTC Dual Scenario Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - "Src/Engines/AutonomousTechnicalAnalyst/btc_scenario_monitor.py"
      - "Src/Engines/AutonomousTechnicalAnalyst/test_btc_scenario_monitor.py"
      - ".github/workflows/btc_scenario_monitor.yml"
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-dual-scenario-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scenario Monitor Tests
        run: |
          python -m unittest Src.Engines.AutonomousTechnicalAnalyst.test_btc_scenario_monitor -v

      - name: Run BTC Dual Scenario Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.btc_scenario_monitor

      - name: Save Scenario Monitoring State
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Signals/btc_scenario_monitor_state.json Data/Signals/btc_scenario_events.json
          if git diff --cached --quiet; then
            echo "No scenario state changes."
            exit 0
          fi
          git commit -m "Update BTC dual scenario monitoring state"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Scenario state saved."
              exit 0
            fi
            sleep 3
          done
          echo "Unable to save scenario state."
          exit 1

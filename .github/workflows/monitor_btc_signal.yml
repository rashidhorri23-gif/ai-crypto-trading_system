
name: BTC 5M Signal Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run BTC Signal Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.monitor_btc_signal

      - name: Save Monitor State and Paper Trading Ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f Data/Signals/btc_monitor_state.json ]; then
            git add Data/Signals/btc_monitor_state.json
          fi

          if [ -f Data/Trading/paper_trading.json ]; then
            git add Data/Trading/paper_trading.json
          fi

          if git diff --cached --quiet; then
            echo "No state or paper trading changes."
            exit 0
          fi

          git commit -m "Update BTC monitor state and paper trading ledger"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

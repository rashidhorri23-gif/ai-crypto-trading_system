
name: Market Features Validation

on:
  workflow_dispatch:

  push:
    paths:
      - "Src/Engines/AutonomousTechnicalAnalyst/market_features.py"
      - "Src/Engines/AutonomousTechnicalAnalyst/test_market_features.py"
      - "Src/Engines/AutonomousTechnicalAnalyst/config.py"
      - "Src/Engines/AutonomousTechnicalAnalyst/tradingview_chart.py"
      - "Src/Engines/AutonomousTechnicalAnalyst/test_tradingview_chart.py"
      - "Data/Archive/BTC_USDT_SPOT_4H.csv"
      - "requirements.txt"
      - ".github/workflows/market_features_test.yml"

jobs:
  validate-market-features:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.65.2

      - name: Install Chromium for chart tests
        run: |
          python -m playwright install --with-deps chromium

      - name: Run TradingView chart rendering test
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.test_tradingview_chart

      - name: Run market features validation
        run: |
          python -m Src.Engines.AutonomousTechnicalAnalyst.test_market_features
